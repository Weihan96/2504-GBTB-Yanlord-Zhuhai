  <rect class="panel" x="45" y="155" width="735" height="760" rx="18"/><text class="sheet" x="73" y="205">D-601</text><text class="subtitle" x="195" y="204">材料与收口节点</text><rect class="row" x="65" y="235" width="695" height="92" rx="10"/><circle class="badge" cx="100" cy="266" r="22"/><text class="badge-text" x="100" y="271">N01</text><text class="category" x="135" y="260">墙面阳角</text><text class="scope" x="135" y="284">主要通行动线与高频接触区</text><text class="pending" x="135" y="308">变量：位置｜转角形式｜可见面宽度｜与墙面完成面的关系</text><text class="status" x="655" y="262">待复核</text><text class="lock" x="655" y="302">不写 IFC</text><rect class="row" x="65" y="343" width="695" height="92" rx="10"/><circle class="badge" cx="100" cy="374" r="22"/><text class="badge-text" x="100" y="379">N02</text><text class="category" x="135" y="368">地面材料交界</text><text class="scope" x="135" y="392">F11/F21 地板与 F20 银白洞石岩板等交界</text><text class="pending" x="135" y="416">变量：交界位置｜收口型式｜缝宽｜高差｜伸缩/维修条件</text><text class="status" x="655" y="370">待复核</text><text class="lock" x="655" y="410">不写 IFC</text><rect class="row" x="65" y="451" width="695" height="92" rx="10"/><circle class="badge" cx="100" cy="482" r="22"/><text class="badge-text" x="100" y="487">N03</text><text class="category" x="135" y="476">门槛与推拉门地轨</text><text class="scope" x="135" y="500">M01–M08 门槛及推拉门地轨联动</text><text class="pending" x="135" y="524">变量：门号｜两侧完成面｜齐平/防水策略｜地轨型式｜门下净空</text><text class="status" x="655" y="478">待复核</text><text class="lock" x="655" y="518">不写 IFC</text><rect class="row" x="65" y="559" width="695" height="92" rx="10"/><circle class="badge" cx="100" cy="590" r="22"/><text class="badge-text" x="100" y="595">N04</text><text class="category" x="135" y="584">墙地顶收口</text><text class="scope" x="135" y="608">踢脚、墙顶交界与不同材料收口</text><text class="pending" x="135" y="632">变量：房间/墙段｜踢脚型式｜墙顶收口｜材料分界｜阴影缝/密封策略</text><text class="status" x="655" y="586">待复核</text><text class="lock" x="655" y="626">不写 IFC</text><rect class="row" x="65" y="667" width="695" height="92" rx="10"/><circle class="badge" cx="100" cy="698" r="22"/><text class="badge-text" x="100" y="703">N05</text><text class="category" x="135" y="692">柜墙交界</text><text class="scope" x="135" y="716">固定家具、台面、饰面与墙体交界</text><text class="pending" x="135" y="740">变量：空间/柜组｜收口位置｜可调节缝｜密封｜拆装与检修路径</text><text class="status" x="655" y="694">待复核</text><text class="lock" x="655" y="734">不写 IFC</text><rect class="row" x="65" y="775" width="695" height="92" rx="10"/><circle class="badge" cx="100" cy="806" r="22"/><text class="badge-text" x="100" y="811">N06</text><text class="category" x="135" y="800">阳台管道包覆</text><text class="scope" x="135" y="824">阳台水管、阀门、接头与检修口</text><text class="pending" x="135" y="848">变量：管道/阀门位置｜包覆边界｜检修口｜通风/冷凝水｜拆卸顺序</text><text class="status" x="655" y="802">待复核</text><text class="lock" x="655" y="842">不写 IFC</text>
