<text x="80" y="65" font-family="Arial, sans-serif" font-size="31" font-weight="700">505 UP Plan：真实顶视深度 + 当前黑线叠加</text>
<text x="80" y="105" font-family="Arial, sans-serif" font-size="18" fill="#444">亮色更高、暗色更低；相同投影位置仅保留从上向下首先命中的可见面。</text>
<text x="80" y="135" font-family="Arial, sans-serif" font-size="15" fill="#666">画面方向：左→右 = 项目 world +X；上→下 = 项目 world +Y。黑线是当前候选，不是本轮定稿。</text>
